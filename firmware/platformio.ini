; Cart Dash ESP32-S3 firmware.
;   pio run                 build for the board
;   pio run -t upload       flash it
;   pio device monitor      watch the JSON stream
;   pio test -e native      unit tests on the laptop, against protocol/fixtures
;   pio run -e host         laptop build that prints the simulated stream
;
; The platform version is pinned on purpose: the TWAI, PCNT, and sleep APIs
; differ between Arduino core 2.x and 3.x. espressif32 8.0.0 is Arduino core
; 3.3.12. Change it only on purpose.

[platformio]
default_envs = esp32s3

[env]
lib_deps =
    bblanchon/ArduinoJson@7.4.2
build_flags =
    -Wall

[env:esp32s3]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
; N16R8: 16 MB quad flash, 8 MB octal PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    ; Serial is the chip's built-in USB Serial/JTAG port (CDC ACM, VID 0x303A, PID 0x1001).
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; No core debug text on the port: the stream must always parse.
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> -<host_main.cpp>
monitor_speed = 115200

; Laptop builds share the pure modules: state, protocol, logic, sim.
[native_common]
platform = native
build_src_filter = +<*> -<main.cpp> -<usb_link.cpp> -<config_store.cpp> -<host_main.cpp>
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -DFIXTURES_DIR=\"$PROJECT_DIR/../protocol/fixtures\"

[env:native]
extends = native_common
test_framework = unity
test_build_src = yes

[env:host]
extends = native_common
build_src_filter = ${native_common.build_src_filter} +<host_main.cpp>
